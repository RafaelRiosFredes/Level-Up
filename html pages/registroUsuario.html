</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
      <div class="container">
        <a class="navbar-brand" href="#">LEVEL-UP GAMER</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>

            <li class="nav-item"><a class="nav-link" href="#">Consolas</a></li>

            <li class="nav-item"><a class="nav-link" href="#">Noticias</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <section class="title text-center">
    <div class="container title-wrapper">
      <img src="https://www.azernews.az/media/2023/11/27/2023_rog_zephyrus_duo_16_gx650_scenario_photo_01.jpg?v=1701092248" 
           alt="gamer-notebook" class="title-img-contact">
    </div>
  </section>

  <section class="RegistroUsuario-box">
    <form>
      <fieldset>
        <legend class="Registro1">Registro de Usuario</legend>

        <div class="Nombre-usuario-registro">
          <label for="Nombre">Nombre Completo</label>
          <input type="text" id="Nombre" name="Nombre" placeholder="Ingrese su nombre completo"><br>
        </div>

        <div class="email-registro">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="Ingrese su correo electronico"><br>
        </div>

        <div class="constraseña-registro">
          <label for="contraseña">Contraseña</label>
          <input type="password" id="contraseña" name="password" placeholder="Ingrese su contraseña"><br>
        </div>

        <div class="constraseña-registro-confirmacion">
          <label for="contraseña">Confirmar Contraseña</label>
          <input type="password" id="contraseña" name="password" placeholder="Ingrese nuevamente su contraseña"><br>
        </div>

        <div class="telefono-registro">
          <label for="telefono">Telefono (Opcional)</label>
          <input type="tel" id="telefono" name="telefono" placeholder="Ingrese su numero de telefono"><br>
        </div>

        <div class="selector-region">
          <select id="region" name="region" onchange="actualizarComunas()">
            <option value="">Selecciona tu Región</option>
            <option value="Ari">Arica y Parinacota</option>
            <option value="Tar">Tarapacá</option>
            <option value="Ant">Antofagasta</option>
            <option value="Ata">Atacama</option>
            <option value="Coq">Coquimbo</option>
            <option value="Val">Valparaíso</option>
            <option value="stgo">Metropolitana </option>
            <option value="OHi">O’Higgins</option>
            <option value="Mau">Maule</option>
            <option value="Nub">Ñuble</option>
            <option value="Bio">Biobío</option>
            <option value="Arau">La Araucanía</option>
            <option value="Rio">Los Ríos</option>
            <option value="Lag">Los Lagos</option>
            <option value="Ays">Aysén</option>
            <option value="Mag">Magallanes</option>
          </select>

          <select id="comuna" name="comuna">
            <option value=""> Selecciona tu Comuna </option>
          </select>
        </div>

        <button class="boton-registro" type="submit">Registrar</button>
      </fieldset>
    </form>
  </section>

  <footer class="bg-black text-white text-center py-4">

  <script src="registroUsuario.js"></script>
</body>
</html>
