<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level-Up Gamer - Carrito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
      <div class="container">
        <a class="navbar-brand" href="index.html">LEVEL-UP GAMER</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <!-- Barra de búsqueda -->
          <form class="d-flex mx-auto search-bar">
            <input class="form-control me-2" type="search" placeholder="Buscar en LEVEL-UP GAMER" aria-label="Buscar">
            <button class="btn btn-outline-success" type="submit"><i class="bi bi-search"></i></button>
          </form>

          <!-- Menú de navegación -->
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
            <li class="nav-item"><a class="nav-link" href="noticias.html">Noticias </a></li>
            <li class="nav-item">
              <a class="nav-link nav-link-carrito" href="carroCompras.html">
                <i class="bi bi-cart3">  
                  <span class="badge" id="cantidad-carrito">0</span>
                </i>
                Carrito
              </a>
            </li>
            <!-- Dropdown de login -->
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="loginDropdown" role="button">
                Hola, Inicia sesión
              </a>
              <ul class="dropdown-menu dropdown-menu-end bg-dark text-white" aria-labelledby="loginDropdown">
                <li><a class="dropdown-item text-white" href="login.html">Inicia sesión</a></li>
                <li><a class="dropdown-item text-white" href="registroUsuario.html">Regístrate</a></li>
                <li><a class="dropdown-item text-white" href="#">Mi cuenta</a></li>
                <li><hr class="dropdown-divider bg-light"></li>
                <li><a class="dropdown-item text-white" href="#">Puntos LevelUp</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <h2 class="mb-4 highlight">Mi carrito de compras</h2>
    <div class="row g-4">
      <!-- Lista de productos dinámica -->
      <div class="col-md-8" id="lista-carrito">
        <!-- Productos cargados por JS -->
      </div>

      <!-- Resumen -->
      <div class="col-md-4">
        <div class="bg-dark p-4 rounded">
          <h5 class="mb-3">TOTAL: <span class="price" id="totalCarrito">$0</span></h5>
          <form>
            <label for="cupon" class="form-label">Ingrese el cupón de descuento</label>
            <div class="input-group mb-3">
              <input type="text" id="cupon" class="form-control" placeholder="Código">
              <button class="btn btn-outline-light" type="button">Aplicar</button>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold">PAGAR</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-black text-white text-center py-4 mt-5">
    <p>&copy; 2025 LEVEL-UP GAMER. Todos los derechos reservados.</p>
  </footer>

  <script>
    function actualizarBadgeCarrito() {
      const badge = document.getElementById("cantidad-carrito");
      const carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      const totalCantidad = carrito.reduce((acc, item) => acc + item.cantidad, 0);
      badge.innerText = totalCantidad;
    }

    function mostrarCarrito() {
      const lista = document.getElementById("lista-carrito");
      let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      lista.innerHTML = "";

      if (carrito.length === 0) {
        lista.innerHTML = "<p class='text-white'>Tu carrito está vacío 🛒</p>";
        document.getElementById("totalCarrito").innerText = "$0";
        return;
      }

      let total = 0;

      carrito.forEach((item, index) => {
        total += item.precio * item.cantidad;

        let div = document.createElement("div");
        div.classList.add("d-flex", "align-items-center", "bg-dark", "p-3", "rounded", "mb-3");
        div.innerHTML = `
          <img src="${item.imagen}" class="rounded me-3" alt="${item.nombre}" style="width:100px;">
          <div class="flex-grow-1">
            <h5 class="mb-1">${item.nombre}</h5>
            <p class="text-muted small">Precio unitario: $${item.precio}</p>
            <div class="d-flex align-items-center">
              <button class="btn btn-sm btn-outline-light" onclick="cambiarCantidad(${index}, -1)"><i class="bi bi-dash"></i></button>
              <input type="number" value="${item.cantidad}" min="1" class="form-control mx-1 text-center" style="width:60px;" disabled>
              <button class="btn btn-sm btn-outline-light" onclick="cambiarCantidad(${index}, 1)"><i class="bi bi-plus"></i></button>
            </div>
          </div>
          <p class="price me-3">$${item.precio * item.cantidad}</p>
          <button class="btn btn-sm btn-danger" onclick="eliminarProducto(${index})">
            <i class="bi bi-trash"></i>
          </button>
        `;
        lista.appendChild(div);
      });

      document.getElementById("totalCarrito").innerText = "$" + total;
    }

    function eliminarProducto(index) {
      let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      carrito.splice(index, 1);
      localStorage.setItem("carrito", JSON.stringify(carrito));
      actualizarBadgeCarrito();
      mostrarCarrito();
    }

    function cambiarCantidad(index, cambio) {
      let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      carrito[index].cantidad += cambio;
      if (carrito[index].cantidad < 1) carrito[index].cantidad = 1;
      localStorage.setItem("carrito", JSON.stringify(carrito));
      actualizarBadgeCarrito();
      mostrarCarrito();
    }

    document.addEventListener("DOMContentLoaded", () => {
      actualizarBadgeCarrito();
      mostrarCarrito();
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/busqueda.js"></script>
  <script src="../scripts/carroCompras.js"></script>


</body>
</html>
